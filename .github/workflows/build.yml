name: Validate Docker Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t reelai-smoke .
      - name: Start Streamlit and check health
        run: |
          docker run -d --name reelai-smoke -p 7860:7860 -e SPACE_ID=test/reelai -e REELAI_PASSWORD=test-only reelai-smoke
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:7860/_stcore/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs reelai-smoke
          exit 1
      - name: Render login and main app
        run: |
          # Reproduce a Space sync that omitted bundled font assets.
          docker exec reelai-smoke sh -c 'mv /app/resource/fonts /app/resource/fonts.bak && mkdir /app/resource/fonts'
          docker exec reelai-smoke python -c '
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("webui/Main.py").run(timeout=90)
          assert not app.exception, app.exception
          assert app.title[0].value == "ReelAI"
          app.text_input[0].set_value("test-only")
          app.button[0].click().run(timeout=90)
          assert not app.exception, app.exception
          '
          docker exec reelai-smoke test -f /app/resource/fonts/DejaVuSans.ttf
