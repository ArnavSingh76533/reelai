name: Deploy to Hugging Face Spaces

on:
  workflow_dispatch:
    inputs:
      space_id:
        description: "Your Space ID, for example username/reelai"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hugging Face Hub client
        run: python -m pip install 'huggingface_hub>=0.34,<2'
      - name: Create or update Docker Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REELAI_PASSWORD: ${{ secrets.REELAI_PASSWORD }}
          SPACE_ID: ${{ inputs.space_id }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN", "")
          space_id = os.environ["SPACE_ID"].strip()
          if not token:
              raise SystemExit("Add HF_TOKEN as a GitHub Actions repository secret before deploying.")
          password = os.environ.get("REELAI_PASSWORD", "")
          if not password:
              raise SystemExit("Add REELAI_PASSWORD as a GitHub Actions repository secret before deploying.")
          if space_id.count("/") != 1 or not all(space_id.split("/")):
              raise SystemExit("space_id must look like username/reelai")
          api = HfApi(token=token)
          api.create_repo(repo_id=space_id, repo_type="space", space_sdk="docker", exist_ok=True)
          api.add_space_secret(repo_id=space_id, key="REELAI_PASSWORD", value=password)
          api.upload_folder(
              repo_id=space_id,
              repo_type="space",
              folder_path=".",
              ignore_patterns=[".github/**", ".git/**", ".env*", "config.toml", "storage/**", "models/**"],
              commit_message="Deploy ReelAI from GitHub",
          )
          print(f"Deployed to https://huggingface.co/spaces/{space_id}")
          PY
